name: Workflow versus Superpowers
# Harbor containers are the default coding backend.
runner:
  harness: codex                # codex or claude
  model: gpt-6.1-sol
  reasoning: medium

guidance:
  workflow: [/path/to/workflow/skills]
  superpowers: [/path/to/superpowers/skills]
  # Each named package can combine skills and global instruction files.
  # Vanilla is included automatically.

tasks:
  source: /tmp/deep-swe/tasks
  ids:
    - ofetch-per-origin-circuit-breaker
    - testem-per-launcher-reports
    - happy-dom-abort-pending-body-reads

measurements: [tokens, lines, cyclomatic, cognitive, dead_code, coverage, review]
# Add test_overlap only when needed; it reruns tests and can take hours.
reviewer:
  harness: codex
  model: gpt-6-astra
  reasoning: high
  guidance: [/path/to/fixed-review-standards.md]  # Same criteria for all outputs.

repeats: 3
# jobs: 2  # Optional request; capped by Docker CPU and memory capacity.
# CPU and memory default to task.toml; Docker must fit them before any model call.
# container_cpus: 2
# container_memory_mb: 8192
# timeout_seconds: 1800  # Separate agent budget; shorter than these tasks declare.
