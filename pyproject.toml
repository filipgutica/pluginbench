[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pluginbench"
version = "0.4.0"
description = "Test whether skills help coding agents make fewer mistakes."
readme = "README.md"
requires-python = ">=3.12"
# The wheel bundles ECharts (Apache-2.0), which includes ZRender (BSD-3-Clause).
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "src/pluginbench/vendor/*-LICENSE", "src/pluginbench/vendor/*-NOTICE"]
authors = [{ name = "Filip Gutica" }]
keywords = ["coding agents", "evaluation", "benchmark", "skills", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  # Pinned exactly: runs record this Harbor version and refuse any other.
  "harbor==0.24.0",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.15,<0.16",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
pluginbench = "pluginbench.cli:app"

[project.urls]
Homepage = "https://github.com/filipgutica/pluginbench"
Documentation = "https://github.com/filipgutica/pluginbench/blob/main/docs/running-evaluations.md"
Repository = "https://github.com/filipgutica/pluginbench"
Issues = "https://github.com/filipgutica/pluginbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pluginbench"]

# The source distribution holds what builds the wheel. Tests and their fixtures, saved
# evidence, and the chart build stay in the repository.
[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pluginbench"]
exclude = "^tests/fixtures/"
