name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Keeps a release pull request up to date. Merging that pull request tags the release.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update the release pull request, or tag a merged one
        id: release
        uses: googleapis/release-please-action@v5

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install 'build>=1.3,<2'
          python -m build

      - name: Check the built package
        run: python scripts/check_dist.py

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # The only job that can publish. It runs no repository code: it uploads what `build` made.
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pluginbench/
    permissions:
      id-token: write
    steps:
      - name: Fetch the built package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
