name: Release

on:
  push:
    branches: [main]

# The jobs that write or publish pin their actions to a commit, so an upstream change cannot
# reach them without a change to this file.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Keeps a release pull request up to date. Merging that pull request tags the release.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update the release pull request, or tag a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          # The full ref: a branch with the tag's name must never be built instead.
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install 'build>=1.3,<2'
          python -m build

      - name: Check the built package
        run: python scripts/check_dist.py

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # The only job that can publish. It runs no repository code: it uploads what `build` made.
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pluginbench/
    permissions:
      id-token: write
    steps:
      - name: Fetch the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
