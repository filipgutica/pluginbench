name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Bubblewrap
        # The sandbox tests run bwrap, which needs unprivileged user namespaces; Ubuntu 24.04 blocks them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the package
        run: python -m pip install -e '.[dev,harbor]'

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

      - name: Build the package
        run: python -m build
