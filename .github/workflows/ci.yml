name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Bubblewrap
        # The sandbox tests run bwrap, which needs unprivileged user namespaces; Ubuntu 24.04 blocks them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the package
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

      - name: Build the package
        run: python -m build

      - name: Check the built package
        run: python scripts/check_dist.py

      - name: Run the installed wheel
        # From outside the checkout, so `pluginbench` can only be the installed wheel.
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          wheel/bin/pluginbench --version
          wheel/bin/pluginbench init evaluation.yaml
          wheel/bin/pluginbench compare \
            "$GITHUB_WORKSPACE/tests/fixtures/compare/pilot-coverage" \
            "$GITHUB_WORKSPACE/tests/fixtures/compare/pilot-no-coverage" \
            --gates "$GITHUB_WORKSPACE/tests/fixtures/compare/card-gates.yaml"
