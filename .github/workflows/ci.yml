name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Bubblewrap
        # The sandbox tests run bwrap, which needs unprivileged user namespaces; Ubuntu 24.04 blocks them by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the package
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

      - name: Start a systemd user manager
        # The runner already has a user manager, so the Test step runs the systemd tests too.
        # Start it explicitly anyway, as the P4 plan asks, rather than rely on the runner image;
        # lingering is fine on a disposable runner.
        run: |
          sudo apt-get install -y dbus-user-session
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            state=$(systemctl --user is-system-running || true)
            case "$state" in running|degraded) exit 0 ;; esac
            sleep 1
          done
          echo "The user manager did not start: ${state:-no answer}"
          exit 1

      - name: Test with real systemd
        # A systemd test that skips, such as on a runner without a user manager, fails the job.
        env:
          PLUGINBENCH_REQUIRE_SYSTEMD_TESTS: "1"
        run: pytest -m systemd

      - name: Build the package
        run: python -m build

      - name: Check the built package
        run: python scripts/check_dist.py

      - name: Run the installed wheel
        # From outside the checkout, so `pluginbench` can only be the installed wheel.
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          wheel/bin/pluginbench --version
          wheel/bin/pluginbench init evaluation.yaml
          wheel/bin/pluginbench compare \
            "$GITHUB_WORKSPACE/tests/fixtures/compare/pilot-coverage" \
            "$GITHUB_WORKSPACE/tests/fixtures/compare/pilot-no-coverage" \
            --gates "$GITHUB_WORKSPACE/tests/fixtures/compare/card-gates.yaml"
