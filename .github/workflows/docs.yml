name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "README.md"

permissions:
  contents: read

# Runs for one ref queue, so two deploys from main never overlap. A newer pull request push
# cancels the older check; a deploy is never cancelled part-way.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: python -m pip install zensical==0.1.1

      - name: Build the site
        # Strict mode fails on a link to a page that does not exist.
        run: zensical build --clean --strict

      - name: Check internal links and anchors
        # Offline: only links between built pages and their #anchors. 404.html is left out
        # because it uses absolute paths under the site URL, which do not exist on disk.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments --index-files index.html --no-progress
            --root-dir ${{ github.workspace }}/site --exclude-path site/404.html
            'site/**/*.html'

      - name: Check external links
        # Reports dead external links but does not fail the build: a third-party outage
        # should not block a documentation change. The site's own URL is skipped because
        # it does not exist until the first deploy.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: false
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 10 --accept '200..=299,429'
            --exclude '^https://filipgutica\.github\.io/pluginbench/'
            --exclude-path site/404.html
            'site/**/*.html'

      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Needs GitHub Pages enabled with the source set to "GitHub Actions".
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
