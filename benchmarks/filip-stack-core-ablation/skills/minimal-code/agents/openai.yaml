interface:
  display_name: "Minimal Code"
  short_description: "Default to small, readable, low-ceremony implementation"
  default_prompt: >-
    Use $workflow:minimal-code for implementation. Prefer the smallest correct,
    readable change. Reuse project code and platform features. Avoid speculative
    abstractions and dependencies. Add JSDoc only to shared, exported, or
    non-obvious utilities. Preserve correctness, verification, types, security,
    accessibility, and explicit requirements.
policy:
  allow_implicit_invocation: true
