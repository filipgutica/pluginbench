schema_version: 1
experiment:
  name: workflow-pytest-preservation-control
dataset:
  adapter: swe-bench
  name: SWE-bench/SWE-bench_Verified
  version: 78f471bf655a3137b2e8a75af1501690ec009ec3
  source: ../swe-bench-verified-hard/tasks.json
  task_ids:
    - pytest-dev__pytest-5787
  harness:
    executable: ../../.venv/bin/swebench
    version: 5.0.2
    image_platform: linux/amd64
  starting_patches:
    pytest-dev__pytest-5787:
      path: seeds/preservation.patch
      expected_score: 1
skill:
  # Always override this path with --skill for a recorded study and verify the
  # resolved digest. The path is a local fallback, not the treatment identity.
  path: ../../../filip-stack/plugins/workflow/skills
agent:
  provider: openai:codex-sdk
  codex_sdk_version: 0.151.0
  model: gpt-5.6-luna
  reasoning: high
  sandbox_mode: workspace-write
  approval_policy: never
  network_access_enabled: false
  web_search_enabled: false
  auth_file: ~/.codex/auth.json
tooling:
  promptfoo_version: 0.122.2
  container_image: pluginbench-runtime:0.2.0
execution:
  baseline:
    mode: run
  # Three attempts are the complete preservation control for a promoted pilot.
  attempts: 3
  concurrency: 1
  batch_size: 1
  max_tasks: 1
  timeout_seconds: 600
limits:
  max_total_tokens: 12000000
  max_total_cost_usd: 1.5
estimates:
  tokens_per_trial: 1500000
  cost_per_trial_usd: 0.15
decision:
  minimum_pass_rate_lift_pp: 0
  maximum_cost_overhead_pct: 20
  maximum_incremental_cost_per_additional_success_usd: null
output:
  runs_dir: ../../runs
