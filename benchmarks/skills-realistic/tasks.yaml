schema_version: 1
tasks:
  - id: branch-exclusions
    fixture: fixtures/branch-exclusions
    prompt: >-
      Add branch exclusions to the worktree list query. FilterOptions must accept
      excludeBranch as a comma-separated string, buildFilters must expose the parsed
      patterns as Filters.excludeBranches, and applyFilters/queryWorktrees must exclude
      a worktree whose non-null branch matches any exclusion. Match case-sensitively
      against the whole branch using the existing * and ? glob behavior; treat regex
      metacharacters literally. Trim each comma-separated token and reject empty tokens
      with InvalidFilterError, including when the input worktree list is empty.
      Exclusions combine with the existing inclusion, age, dirty, PR-state, main-worktree,
      and sorting options. A null branch does not match an exclusion. Preserve existing
      public behavior and do not mutate the input collection. You may change src/ and
      extend test/; keep package.json, tsconfig.json, and notes.md unchanged.
      Use the dependency-free package.json test command. Do not install packages or
      access network services. Remove temporary artifacts before finishing.
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 60
  - id: bounded-collection
    fixture: fixtures/bounded-collection
    prompt: >-
      Fix mapLimit and verify its worktree collection caller. Reject concurrency limits
      that are not finite positive integers with RangeError, even for empty input, before
      invoking any mapper. Process every input position, including undefined values,
      preserve input order, and never exceed the concurrency limit. On the first observed
      mapper failure, start no further work, wait for already-started operations to settle,
      then reject with that original failure. Handle synchronous mapper throws as well as
      rejected promises. collect/loadCatalog must preserve their existing metadata, main
      and current worktree flags, one bulk PR lookup, noPr behavior, and query filtering;
      invalid concurrency and metadata failures must propagate through those callers.
      You may change src/ and extend test/; keep package.json, tsconfig.json, and notes.md
      unchanged. Use the dependency-free package.json test command. Do not install
      packages or access network services. Remove temporary artifacts before finishing.
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 60
