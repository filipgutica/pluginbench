schema_version: 1
tasks:
  - id: metadata-summary
    prompt: >-
      If Engineering is available, use it and read its full SKILL.md with a tool before starting.
      Complete formatWorktreeSummary so the focused preview displays branch, elapsed age,
      and disk size separated by " · ". Existing formatting conventions define age and
      size, including missing values. Preserve the existing helpers, callers, tests, and
      unrelated files. You may edit src/worktree-summary.ts and add relevant
      test/**/*.test.ts files. Avoid dependencies. Run the repository tests with native type stripping;
      package.json documents the command. Temporary check files belong only in
      .pilot-scratch or the trial-owned TMPDIR; remove your scratch before finishing.
    fixture: fixtures/metadata-summary
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 30
  - id: selection-count
    prompt: >-
      If Engineering is available, use it and read its full SKILL.md with a tool before starting.
      Add a readonly count property to SelectionState reporting the current number of
      distinct selected paths. It must remain correct after toggle, replace, and clear,
      including duplicate replacement paths and subsequent mutations. Assignment must
      not change count. Preserve the existing membership API, caller, tests, and unrelated
      files. You may edit src/selection-state.ts and add relevant test/**/*.test.ts files.
      Avoid dependencies. Run the repository tests with native type stripping;
      package.json documents the command. Temporary check files belong only in
      .pilot-scratch or the trial-owned TMPDIR; remove your scratch before finishing.
    fixture: fixtures/selection-count
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 30
  - id: grid-version-bump
    prompt: >-
      If Engineering is available, use it and read its full SKILL.md with a tool before starting.
      Bump @kong-ui-public/table-data-grid from 1.4.0 to 1.4.1 across its existing workspace
      declarations and lockfile. Keep this a dependency-version-only update; do not broaden
      consumers or change sources/assets. Preserve existing tests and unrelated files;
      relevant new test/**/*.test.ts files may be added. Do not install packages or
      access the network. Run the repository tests using the package.json command.
      Temporary check files belong only in .pilot-scratch or the trial-owned TMPDIR;
      remove your scratch before finishing.
    fixture: fixtures/grid-version-bump
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 30
