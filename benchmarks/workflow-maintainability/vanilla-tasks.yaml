schema_version: 1
tasks:
  - id: metadata-summary
    prompt: >-
      Complete formatWorktreeSummary so the focused preview displays branch,
      elapsed age, and disk size separated by " · ". Existing formatting
      conventions define age and size, including missing values.
    fixture: fixtures/metadata-summary
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 30
  - id: selection-count
    prompt: >-
      Add a readonly count property to SelectionState reporting the number of
      distinct selected paths after toggle, replace, and clear, including
      duplicate replacement paths and subsequent mutations. Assignment must
      not change count.
    fixture: fixtures/selection-count
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 30
  - id: grid-version-bump
    prompt: >-
      Bump @kong-ui-public/table-data-grid from 1.4.0 to 1.4.1 across its existing
      workspace declarations and lockfile.
    fixture: fixtures/grid-version-bump
    verifier:
      command: [node]
      script: verifier.mjs
      timeout_seconds: 30
